name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require a version tag on main
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$RELEASE_TAG" != "v${package_version}" ]; then
            echo "::error::Publishing requires the tag v${package_version}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::v${package_version} must point to a commit on main."
            exit 1
          fi
          echo "v${package_version} points to a commit on main."
      - name: Install MCP dependencies
        run: npm ci --prefix necktie-mcp
      - name: Run all checks
        run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # A job-level `environment:` changes the OIDC subject; npm's trusted publisher must name the same environment.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@latest
      - name: Check registry state
        id: registry
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish
      - name: Verify npm publication
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          for attempt in {1..12}; do
            if published_version="$(npm view "${package_name}@${package_version}" version)" && [ "$published_version" = "$package_version" ]; then
              echo "${package_name}@${package_version} is available on npm."
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::${package_name}@${package_version} was not visible on npm after 12 attempts."
          exit 1

name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install MCP dependencies
        run: npm ci --prefix necktie-mcp
      - name: Run all checks
        run: npm test
      - name: Verify generation is idempotent
        run: npm run build:adapters
      - name: Require a clean generated diff
        run: git diff --exit-code
